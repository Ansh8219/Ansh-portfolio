<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/Ansh_icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0B10" />
    <meta name="keywords" content="Ansh, full stack developer, AI developer, DevOps engineer, system architecture, Python, Django, FastAPI, React, Flutter, AWS, cloud, portfolio" />
    <meta name="author" content="Ansh" />
    
    <!--
      Per-route <title>, description, canonical, Open Graph, Twitter and JSON-LD tags are
      generated at build time from src/seo/ (see scripts/prerender.mjs) and injected here.
      In `vite dev` this stays empty and <SeoManager/> fills the tags in on the client.
    -->
    <!--seo-head-->

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Fraunces:ital,opsz,wght@1,9..144,400;1,9..144,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!--
      Runs before first paint, outside React (so it cannot cause a hydration mismatch):
      - applies the saved theme class (dark is the default),
      - adds `js-motion` (only when motion is allowed) so the hero's entrance starts from a hidden
        state instead of flashing. The guard is removed by the hero once GSAP owns the start
        state, and by a 4s failsafe, so content can never stay hidden.
    -->
    <script>
      (function () {
        var d = document.documentElement;
        try {
          var t = localStorage.getItem('nvs-theme');
          d.classList.add(t === 'light' ? 'light' : 'dark');
          if (t === 'light') {
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute('content', '#EFEBE2');
          }
        } catch (e) { d.classList.add('dark'); }
        if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          d.classList.add('js-motion');
          setTimeout(function () { d.classList.remove('js-motion'); }, 4000);
        }
      })();
    </script>

  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <noscript>
      <style>
        .intro-splash { display: none !important; }
        .page-root { opacity: 1 !important; }
      </style>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
